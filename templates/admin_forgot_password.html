{% extends "base.html" %}

{% block title %}Admin Forgot Password{% endblock %}

{% block content %}
<div class="auth-gloss-wrap">
    <div class="auth-gloss-shell" style="max-width: 430px;">
        <div class="card auth-gloss-card">
            <div style="margin-bottom: 0.5rem;">
                <a href="{{ url_for('auth.role_login', role_key='admin') }}" aria-label="Back" class="auth-back-link">&#8592;</a>
            </div>
            <h3 class="card-header">Admin Forgot Password</h3>

            <p style="text-align:center; margin: 0 0 1.25rem; color: #475569;">
                Sending OTP to your registered email.
            </p>
            <p style="text-align:center; margin: 0 0 1.25rem; color: #64748b; font-size: 0.95rem;">
                Registered email: {{ masked_email }}
            </p>

            <form method="POST">
                <input type="hidden" name="username" value="{{ username }}">
                <button type="submit" class="btn btn-primary" style="width:100%;">
                    Send OTP
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
