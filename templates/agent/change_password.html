{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="dashboard-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">Agent Panel</h2>
        </div>
        <ul class="sidebar-nav">
            <li><a href="{{ url_for('agent.dashboard') }}">Dashboard</a></li>
            <li><a href="{{ url_for('agent.add_student_page') }}">Add Students</a></li>
            <li><a href="{{ url_for('agent.students_data') }}">View Students</a></li>
            <li><a href="{{ url_for('agent.change_password') }}" class="active">Change Password</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Change Password</h1>
        </div>

        <div class="card" style="max-width: 600px;">
            <h3 class="card-header">Update Your Password</h3>

            <form method="POST" action="{{ url_for('agent.change_password') }}">
                <div class="form-group">
                    <label class="form-label">Old Password</label>
                    <input type="password" name="old_password" class="form-control" required autocomplete="current-password">
                </div>

                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" minlength="6" required autocomplete="new-password">
                    <small style="color: var(--text-secondary);">Minimum 6 characters</small>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="6" required autocomplete="new-password">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Update Password</button>
                    <a href="{{ url_for('agent.dashboard') }}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
