{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-gloss-wrap">
    <div class="auth-gloss-shell" style="max-width: 400px;">
        <div class="card auth-gloss-card">
            <h3 class="card-header">Reset Password</h3>

            <form method="POST">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="password" class="form-control" minlength="6" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn btn-success" style="width:100%;">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
