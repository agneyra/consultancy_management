{% extends "base.html" %}

{% block title %}Consultant 2-Step Verification{% endblock %}

{% block guest_nav_login %}{% endblock %}

{% block content %}
<div class="auth-gloss-wrap">
    <div class="auth-gloss-shell" style="max-width: 520px;">
        <div class="card auth-gloss-card animate-scaleIn">
            <div style="margin-bottom: 0.5rem;">
                <a href="{{ url_for('auth.role_login', role_key='consultant') }}" aria-label="Back" class="auth-back-link">&#8592;</a>
            </div>
            <h2 class="card-header">Consultant 2-Step Verification</h2>
            <p class="auth-gloss-muted" style="margin-bottom: 1.25rem;">
                Enter the 6-digit Google Authenticator code to continue.
            </p>

            <form method="POST" action="{{ url_for('auth.agent_2fa') }}">
                <div class="form-group">
                    <label class="form-label">6-digit Authenticator Code</label>
                    <input
                        type="text"
                        name="otp_code"
                        class="form-control"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        minlength="6"
                        placeholder="Enter 6-digit code"
                        required
                        autofocus
                    >
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Verify and Login</button>
            </form>

            <div class="forgot-password-wrapper" style="margin-top: 0.75rem;">
                <a href="{{ url_for('auth.agent_2fa_recover') }}" class="forgot-password-link">
                    Deleted Authenticator Code?
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
